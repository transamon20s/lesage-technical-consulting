<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1725">
<meta name="description" content="LeSage Technical Consulting.">
<title>LeSage Technical Consulting</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
:root{color-scheme:dark;--navy:#0b1725;--white:#fff;--ice:#dce8ef}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:var(--navy);color:var(--white)}
main{position:relative;min-height:100svh;display:grid;place-items:center;isolation:isolate;overflow:hidden;background:#0b1725 url('beach-launch.png') center 52%/cover no-repeat}
main:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(5,14,25,.62),rgba(5,14,25,.24)),linear-gradient(0deg,rgba(5,14,25,.48),rgba(5,14,25,.08))}
.brand{position:absolute;top:clamp(22px,5vw,48px);left:clamp(22px,5vw,56px);display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff}
.brand img{display:block;width:54px;height:40px;object-fit:contain}
.brand span{font-size:clamp(.95rem,2vw,1.12rem);font-weight:650;letter-spacing:.015em}
.center{width:min(100% - 40px,1000px);padding:100px 0;text-align:center;text-shadow:0 2px 24px rgba(0,0,0,.35)}
h1{font-size:clamp(2.5rem,7.2vw,6.4rem);line-height:1.02;letter-spacing:-.055em;font-weight:620;margin:0}
@media(max-width:600px){main{background-position:57% center}.brand img{width:45px;height:34px}.center{padding-top:120px}}
</style>
</head>
<body>
<main>
<a class="brand" href="#" aria-label="LeSage Technical Consulting"><img src="lesage-monogram.png" alt="LeSage monogram"><span>LeSage Technical Consulting</span></a>
<div class="center"><h1>LeSage Technical<br>Consulting</h1></div>
</main>
</body>
</html>
