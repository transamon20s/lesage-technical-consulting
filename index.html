<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1725">
<meta name="description" content="LeSage Technical Consulting.">
<title>LeSage Technical Consulting</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
:root{color-scheme:dark;--navy:#0b1725;--white:#fff;--ice:#dce8ef;--line:rgba(255,255,255,.22)}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--navy);color:var(--white)}
main{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;isolation:isolate;overflow:hidden;background:#0b1725 url('beach-launch.png') center 48%/cover fixed no-repeat;padding:0 20px 48px}
main:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(5,14,25,.58),rgba(5,14,25,.20)),linear-gradient(0deg,rgba(5,14,25,.68),rgba(5,14,25,.12) 70%)}
.brand{align-self:flex-start;margin:clamp(22px,4vw,42px) 0 0 clamp(0px,2vw,28px);display:flex;align-items:center;gap:13px;text-decoration:none;color:#fff}
.brand img{display:block;width:55px;height:36px;object-fit:contain}
.brand span{font-size:clamp(.95rem,2vw,1.12rem);font-weight:650;letter-spacing:.015em}
.content{width:min(100%,760px);margin:auto;text-align:center;padding:clamp(70px,10vh,112px) 0 20px;text-shadow:0 2px 24px rgba(0,0,0,.35)}
h1{font-size:clamp(2.65rem,7.2vw,6.1rem);line-height:1.02;letter-spacing:-.055em;font-weight:620;margin:0 0 34px}
.form-panel{width:min(100%,540px);margin:0 auto;padding:clamp(22px,4vw,34px);text-align:left;background:rgba(7,19,32,.72);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 55px rgba(0,0,0,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);text-shadow:none}
.form-panel h2{margin:0 0 7px;text-align:center;font-size:1.35rem;font-weight:600;letter-spacing:-.02em}
.form-panel .intro{margin:0 0 23px;text-align:center;color:var(--ice);font-size:.95rem;line-height:1.5}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field.full{grid-column:1/-1}
label{font-size:.84rem;font-weight:600;color:#f1f6fa}
input,textarea{width:100%;border:1px solid rgba(255,255,255,.25);border-radius:8px;background:rgba(255,255,255,.96);color:#122033;padding:12px 13px;font:inherit;font-size:.95rem;outline:none}
input:focus,textarea:focus{border-color:#b8d9f4;box-shadow:0 0 0 3px rgba(184,217,244,.22)}
textarea{min-height:116px;resize:vertical}
button{display:block;width:100%;margin-top:18px;padding:13px 18px;border:0;border-radius:8px;background:#f4f7fa;color:#102136;font:inherit;font-weight:700;cursor:pointer;transition:transform .15s ease,background .15s ease}
button:hover{background:#dce8ef;transform:translateY(-1px)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.privacy-note{margin:13px 0 0;text-align:center;font-size:.76rem;color:#d5e0e8}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
@media(max-width:600px){main{background-position:57% center;background-attachment:scroll}.brand{margin-top:22px}.brand img{width:48px;height:32px}.content{padding-top:70px;padding-bottom:24px}h1{margin-bottom:28px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.form-panel{padding:23px 18px}}
</style>
</head>
<body>
<main>
  <a class="brand" href="#top" aria-label="LeSage Technical Consulting home"><img src="lesage-monogram.png" alt="CL monogram"><span>LeSage Technical Consulting</span></a>
  <section class="content" id="top" aria-labelledby="page-title">
    <h1 id="page-title">LeSage Technical<br>Consulting</h1>
    <div class="form-panel">
      <h2>Get in touch</h2>
      <p class="intro">Have a question or a project in mind? Send me a message.</p>
      <form action="https://formspree.io/f/myekqwpl" method="POST">
        <div class="fields">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="Your name" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <div class="field full">
            <label for="subject">Subject</label>
            <input id="subject" name="subject" type="text" placeholder="What can I help with?" required>
          </div>
          <div class="field full">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Tell me a little about what you need…" required></textarea>
          </div>
        </div>
        <label class="hp" aria-hidden="true">Leave this field empty<input name="_gotcha" tabindex="-1" autocomplete="off"></label>
        <button type="submit">Send message</button>
        <p class="privacy-note">Your message will be sent securely through the contact form service.</p>
      </form>
    </div>
  </section>
</main>
</body>
</html>
